name: CI

on:
  push:
  workflow_dispatch:

jobs:
  ci-gate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install ruff (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/ruff.tar.gz https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/ruff.tar.gz --strip-components=1 -C /usr/local/bin
          ruff --version

      - name: Install ruff (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = "$env:TEMP\ruff.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $dest = "$env:TEMP\ruff"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "$dest\ruff.exe" "$bin\" -Force
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          & "$bin\ruff.exe" --version

      - name: Tests
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Package vsix
        run: pnpm --filter problem-explorer package

      - name: Install xvfb (headless display for electron)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke dev extension host
        run: xvfb-run -a pnpm --filter problem-explorer test:electron

      - name: Smoke packaged extension
        run: xvfb-run -a pnpm --filter problem-explorer test:electron:packaged
        timeout-minutes: 20

  ci-extension:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install ruff (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          curl -fsSL -o /tmp/ruff.tar.gz https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/ruff.tar.gz --strip-components=1 -C /usr/local/bin
          ruff --version

      - name: Install ruff (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = "$env:TEMP\ruff.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $dest = "$env:TEMP\ruff"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item "$dest\ruff.exe" "$bin\" -Force
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          & "$bin\ruff.exe" --version

      - name: Tests
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Package vsix
        run: pnpm --filter problem-explorer package

      - uses: actions/upload-artifact@v4
        with:
          name: problem-explorer-vsix-${{ matrix.os }}
          path: packages/extension/*.vsix
          if-no-files-found: error